x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL}
  VALKEY_URL: redis://valkey:6379
  GUSTAVO_DATABASE_SSL: disable
  GUSTAVO_APP_ORIGIN: http://localhost:${GUSTAVO_PORT:-3000}
  GUSTAVO_DEPLOYMENT_PROFILE: "local-mvp-v1"
  GUSTAVO_EVENT_ROOT_KEY_VERSION: "1"
  GUSTAVO_EVENT_ROOT_KEY_V1: ${GUSTAVO_EVENT_ROOT_KEY_V1}
  GUSTAVO_CURSOR_SIGNING_KEY: ${GUSTAVO_CURSOR_SIGNING_KEY}
  GUSTAVO_CACHE_ENCRYPTION_KEY: ${GUSTAVO_CACHE_ENCRYPTION_KEY}
  GUSTAVO_COUNCIL_PSEUDONYM_KEY: ${GUSTAVO_COUNCIL_PSEUDONYM_KEY}
  GUSTAVO_EVALUATOR_PSEUDONYM_KEY: ${GUSTAVO_EVALUATOR_PSEUDONYM_KEY}
  GUSTAVO_MODEL_MAIN_PROVIDER: ${GUSTAVO_MODEL_MAIN_PROVIDER}
  GUSTAVO_MODEL_MAIN_MODEL: ${GUSTAVO_MODEL_MAIN_MODEL}
  GUSTAVO_MODEL_MAIN_MONTHLY_BUDGET_USD: ${GUSTAVO_MODEL_MAIN_MONTHLY_BUDGET_USD}
  GUSTAVO_MODEL_NODE_PROVIDER: ${GUSTAVO_MODEL_NODE_PROVIDER}
  GUSTAVO_MODEL_NODE_MODEL: ${GUSTAVO_MODEL_NODE_MODEL}
  GUSTAVO_MODEL_NODE_MONTHLY_BUDGET_USD: ${GUSTAVO_MODEL_NODE_MONTHLY_BUDGET_USD}
  GUSTAVO_MODEL_EVALUATOR_PROVIDER: ${GUSTAVO_MODEL_EVALUATOR_PROVIDER}
  GUSTAVO_MODEL_EVALUATOR_MODEL: ${GUSTAVO_MODEL_EVALUATOR_MODEL}
  GUSTAVO_MODEL_EVALUATOR_MONTHLY_BUDGET_USD: ${GUSTAVO_MODEL_EVALUATOR_MONTHLY_BUDGET_USD}
  GUSTAVO_BACKGROUND_WORKER_OWNER: "worker"
  GUSTAVO_TEST_FIXTURES_ENABLED: "false"

services:
  postgres:
    image: postgres:17.6-bookworm
    restart: on-failure:5
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gustavo}
      POSTGRES_USER: ${POSTGRES_USER:-gustavo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [backend]

  valkey:
    image: valkey/valkey:8.1.3-bookworm
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: on-failure:5
    stop_grace_period: 30s
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [backend]

  migrate:
    image: postgres:17.6-bookworm
    read_only: true
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ../db/migrations:/migrations:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
          'create table if not exists schema_migrations (name text primary key, applied_at timestamptz not null default clock_timestamp())'
        for migration in /migrations/*.sql; do
          name=$$(basename "$$migration")
          applied=$$(psql "$$DATABASE_URL" -At -v ON_ERROR_STOP=1 \
            -c "select count(*) from schema_migrations where name='$$name'")
          if [ "$$applied" = "0" ]; then
            { cat "$$migration"; printf "\ninsert into schema_migrations(name) values (:'migration_name');\n"; } | \
              psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction \
                -v migration_name="$$name"
          fi
        done
    networks: [backend]

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    restart: on-failure:5
    stop_grace_period: 30s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.next/cache:size=64m,mode=1777,uid=1000,gid=1000
    environment:
      <<: *app-environment
      GUSTAVO_OPERATOR_HEALTH_TOKEN: ${GUSTAVO_OPERATOR_HEALTH_TOKEN}
    ports:
      - "127.0.0.1:${GUSTAVO_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backend, frontend]

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker
    command: ["node", "node_modules/tsx/dist/cli.mjs", "worker/runtime.ts"]
    restart: on-failure:5
    stop_grace_period: 30s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - marker=/tmp/gustavo-worker-ready; test -s "$$marker" && pid=$$(cat "$$marker") && [ "$$pid" -gt 1 ] && kill -0 "$$pid"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks: [backend, frontend]

networks:
  backend:
    internal: true
  frontend:

volumes:
  postgres-data:
  valkey-data:
